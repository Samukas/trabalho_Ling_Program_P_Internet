<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de cadastro de usuário da Biblioteca Virtual">
    <title>Cadastro de Usuário | Biblioteca Virtual</title>
</head>
<body>
    <header>
        <h1>Biblioteca Virtual</h1>
        <h2>Cadastro de Usuário</h2>
    </header>

    <main>
        <form action="../php/usuario.php" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo: *</label>
                    <input type="text" id="nome" name="nome" maxlength="100" autocomplete="name" required>
                </p>

                <p>
                    <label for="email">E-mail: *</label>
                    <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required>
                </p>

                <p>
                    <label for="cpf">CPF: *</label>
                    <input type="text" id="cpf" name="cpf" maxlength="11" inputmode="numeric"
                           pattern="[0-9]{11}"
                           title="Informe apenas os 11 dígitos do CPF, sem pontos nem traços."
                           placeholder="00000000000" required>
                </p>

                <p>
                    <label for="data_nascimento">Data de nascimento: *</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="11" inputmode="tel"
                           pattern="[0-9]{10,11}"
                           title="Informe apenas o DDD e o número, com 10 ou 11 dígitos."
                           placeholder="00000000000">
                </p>

                <p>
                    <label for="tipo_usuario">Tipo de usuário: *</label>
                    <select id="tipo_usuario" name="tipo_usuario" required>
                        <option value="">Selecione uma opção</option>
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                        <option value="funcionario">Funcionário</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <p>
                    <label for="cep">CEP: *</label>
                    <input type="text" id="cep" name="cep" maxlength="8" inputmode="numeric"
                           pattern="[0-9]{8}"
                           title="Informe apenas os 8 dígitos do CEP, sem o hífen."
                           placeholder="00000000" required>
                </p>

                <p>
                    <label for="endereco">Endereço: *</label>
                    <input type="text" id="endereco" name="endereco" maxlength="150" autocomplete="street-address" required>
                </p>

                <p>
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" maxlength="60">
                </p>

                <p>
                    <label for="cidade">Cidade: *</label>
                    <input type="text" id="cidade" name="cidade" maxlength="80" required>
                </p>

                <p>
                    <label for="estado">Estado (UF): *</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </p>
            </fieldset>

            <fieldset>
                <legend>Acesso</legend>

                <p>
                    <label for="senha">Senha: *</label>
                    <input type="password" id="senha" name="senha" minlength="8" maxlength="72"
                           autocomplete="new-password"
                           title="A senha deve ter no mínimo 8 caracteres." required>
                </p>

                <p>
                    <label for="confirmar_senha">Confirmar senha: *</label>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" maxlength="72"
                           autocomplete="new-password"
                           title="A senha deve ter no mínimo 8 caracteres." required>
                </p>

                <p>
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" maxlength="500"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="aceite_termos" name="aceite_termos" value="1" required>
                    <label for="aceite_termos">Li e concordo com as regras de uso da biblioteca. *</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </p>
        </form>
    </main>
    <script src="../js/tpi2-ui.js" defer></script>
</body>
</html>
