<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de cadastro de livros da Biblioteca Virtual">
    <title>Cadastro de Livro | Biblioteca Virtual</title>
</head>
<body>
    <header>
        <h1>Biblioteca Virtual</h1>
        <h2>Cadastro de Livro</h2>
    </header>

    <main>
        <form action="../php/livro.php" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>Dados do livro</legend>

                <p>
                    <label for="titulo">Título: *</label>
                    <input type="text" id="titulo" name="titulo" maxlength="200" required>
                </p>

                <p>
                    <label for="autor">Autor: *</label>
                    <input type="text" id="autor" name="autor" maxlength="150" required>
                </p>

                <p>
                    <label for="isbn">ISBN: *</label>
                    <input type="text" id="isbn" name="isbn" maxlength="13" inputmode="numeric"
                           pattern="([0-9]{10}|[0-9]{13})"
                           title="Informe apenas os dígitos do ISBN (10 ou 13), sem o hífen."
                           placeholder="9788533616967" required>
                </p>

                <p>
                    <label for="editora">Editora:</label>
                    <input type="text" id="editora" name="editora" maxlength="100">
                </p>

                <p>
                    <label for="edicao">Edição:</label>
                    <input type="number" id="edicao" name="edicao" min="1" max="50" step="1" value="1">
                </p>

                <p>
                    <label for="ano_publicacao">Ano de publicação: *</label>
                    <input type="number" id="ano_publicacao" name="ano_publicacao" min="1500" max="2100" step="1" required>
                </p>

                <p>
                    <label for="numero_paginas">Número de páginas: *</label>
                    <input type="number" id="numero_paginas" name="numero_paginas" min="1" max="20000" step="1" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Classificação</legend>

                <p>
                    <label for="categoria">Categoria: *</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="ficcao">Ficção</option>
                        <option value="nao-ficcao">Não-ficção</option>
                        <option value="tecnico">Técnico / Acadêmico</option>
                        <option value="infantil">Infantil</option>
                        <option value="biografia">Biografia</option>
                        <option value="poesia">Poesia</option>
                        <option value="hq">HQ e Graphic Novel</option>
                        <option value="autoajuda">Autoajuda</option>
                    </select>
                </p>

                <p>
                    <label for="idioma">Idioma: *</label>
                    <select id="idioma" name="idioma" required>
                        <option value="">Selecione um idioma</option>
                        <option value="pt-BR">Português</option>
                        <option value="en">Inglês</option>
                        <option value="es">Espanhol</option>
                        <option value="fr">Francês</option>
                        <option value="de">Alemão</option>
                        <option value="outro">Outro</option>
                    </select>
                </p>

                <p>
                    <label for="sinopse">Sinopse:</label>
                    <textarea id="sinopse" name="sinopse" rows="5" maxlength="1000"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Estoque e imagem</legend>

                <p>
                    <label for="estoque">Quantidade em estoque: *</label>
                    <input type="number" id="estoque" name="estoque" min="0" max="9999" step="1" value="1" required>
                </p>

                <p>
                    <input type="checkbox" id="disponivel_emprestimo" name="disponivel_emprestimo" value="1" checked>
                    <label for="disponivel_emprestimo">Disponível para empréstimo</label>
                </p>

                <p>
                    <label for="capa">Capa do livro:</label>
                    <input type="file" id="capa" name="capa" accept="image/png,image/jpeg,image/webp">
                </p>
            </fieldset>

            <p>
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </p>
        </form>
    </main>
    <script src="../js/tpi2-ui.js" defer></script>
</body>
</html>
